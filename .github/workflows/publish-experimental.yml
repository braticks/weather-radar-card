name: Publish experimental radar bundle
on:
  workflow_dispatch:
  push:
    branches: [feature/lt-weather-warnings]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - '.github/workflows/publish-experimental.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lt-weather-warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit compiled JS to experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/weather-radar-card.js dist/weather-radar-card-maplibre.js
          if ! git diff --cached --quiet; then
            git commit -m "build: publish experimental European alerts frontend bundle"
            git push origin HEAD:feature/lt-weather-warnings
          fi
