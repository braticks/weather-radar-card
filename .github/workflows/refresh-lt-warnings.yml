name: Refresh Lithuanian weather warnings
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lt-weather-warnings
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download live CAP and official region polygons
        run: python3 scripts/update-lt-warnings.py
      - name: Commit current warnings into feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lt-warnings.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh active Lithuania weather warning polygons"
            git push origin HEAD:feature/lt-weather-warnings
          fi
