name: Compile installable Weather Radar fork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compile-radar-fork.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lt-weather-warnings
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish compiled bundle to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/weather-radar-card.js dist/weather-radar-card-maplibre.js
          if ! git diff --cached --quiet; then
            git commit -m "build: compiled Lithuania hazard overlay frontend"
            git push origin HEAD:feature/lt-weather-warnings
          fi
