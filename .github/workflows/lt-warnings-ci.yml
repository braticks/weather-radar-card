name: Validate European warnings
on:
  push:
    branches: [feature/lt-weather-warnings]
  pull_request:
    branches: ['4.0']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: python3 -m py_compile scripts/update-lt-warnings.py
      - name: Validate live MeteoAlarm feed conversion
        run: |
          WARNINGS_OUTPUT=/tmp/lt-warnings.geojson python3 scripts/update-lt-warnings.py
          python3 -c 'import json; j=json.load(open("/tmp/lt-warnings.geojson")); assert j["type"] == "FeatureCollection" and isinstance(j["features"],list)'
