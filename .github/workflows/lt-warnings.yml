name: Update Lithuania weather warnings
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lt-weather-warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and convert MeteoAlarm warnings
        run: python3 scripts/update-lt-warnings.py
      - name: Commit fresh GeoJSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lt-warnings.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Lithuania weather warnings"
            git push
          fi
